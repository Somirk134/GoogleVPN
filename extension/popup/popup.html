<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Manager</title>
    <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
    <div id="app">
        <!-- 左侧控制区 -->
        <aside class="sidebar">
            <div class="brand">
                <span class="logo-icon">🛡️</span>
                <span class="brand-title">Proxy Manager</span>
            </div>

            <div class="glass-card status-card">
                <div class="status-row">
                    <span class="status-label">Mihomo</span>
                    <div class="status-indicator">
                        <span class="dot" id="statusIndicator"></span>
                        <span class="status-text" id="statusText">未连接</span>
                    </div>
                </div>
                <div class="status-row">
                    <span class="status-label">系统代理</span>
                    <span class="badge badge-disabled" id="proxyStatusBadge">未启用</span>
                </div>
            </div>

            <div class="controls">
                <button id="toggleProxy" class="btn btn-primary">
                    <span class="btn-icon">▶</span> 启用代理
                </button>
                <button id="testAll" class="btn btn-secondary">
                    刷新延迟
                </button>
            </div>

            <!-- IP 信息 -->
            <div class="glass-card ip-card">
                <div class="ip-header">
                    <span class="ip-label">IP 信息</span>
                    <div class="ip-actions">
                        <button class="ip-action-btn" id="ipToggle" title="显示/隐藏">
                            <svg class="eye-icon" id="eyeIcon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                        <button class="ip-action-btn" id="ipRefresh" title="刷新">
                            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
                                <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="ip-detail-list" id="ipDetailList">
                    <div class="ip-detail-row">
                        <span class="ip-detail-label">IP</span>
                        <span class="ip-detail-value ip-address-val" id="ipAddress">检测中...</span>
                    </div>
                    <div class="ip-detail-row">
                        <span class="ip-detail-label">国家</span>
                        <span class="ip-detail-value" id="ipCountry">-</span>
                    </div>
                    <div class="ip-detail-row">
                        <span class="ip-detail-label">位置</span>
                        <span class="ip-detail-value" id="ipLocation">-</span>
                    </div>
                    <div class="ip-detail-row">
                        <span class="ip-detail-label">组织</span>
                        <span class="ip-detail-value" id="ipOrg">-</span>
                    </div>
                    <div class="ip-detail-row">
                        <span class="ip-detail-label">时区</span>
                        <span class="ip-detail-value" id="ipTimezone">-</span>
                    </div>
                    <div class="ip-detail-row">
                        <span class="ip-detail-label">ASN</span>
                        <span class="ip-detail-value" id="ipASN">-</span>
                    </div>
                </div>
            </div>

            <!-- 迷你流量图 -->
            <div class="glass-card mini-traffic-card">
                <div class="mini-traffic-header">
                    <span class="mini-traffic-label">流量</span>
                    <div class="mini-traffic-speeds">
                        <span class="mini-speed up-speed">↑ <span id="miniUpSpeed">0 B/s</span></span>
                        <span class="mini-speed down-speed">↓ <span id="miniDownSpeed">0 B/s</span></span>
                    </div>
                </div>
                <canvas id="miniTrafficChart" width="178" height="40"></canvas>
            </div>

            <button id="settings" class="btn-settings">
                <span>⚙️ 参数设置</span>
            </button>
        </aside>

        <!-- 右侧内容区 -->
        <main class="content">
            <header class="content-header">
                <div class="group-select-wrapper">
                    <select id="groupSelect" class="group-select">
                        <option value="GLOBAL">GLOBAL</option>
                    </select>
                </div>
            </header>
            <div class="proxy-list" id="proxyList">
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-text">正在加载节点...</div>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="popup.js"></script>
</body>
</html>
