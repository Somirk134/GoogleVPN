<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Proxy Manager - 设置</title>
  <link rel="stylesheet" href="styles/options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Proxy Manager 设置</h1>
    </header>
    
    <main>
      <!-- 连接设置 -->
      <section class="section">
        <h2>连接设置</h2>
        <div class="form-group">
          <label>Agent 地址:</label>
          <input type="text" id="agentURL" value="http://127.0.0.1:8765" />
          <small>本地 Agent 服务的 API 地址</small>
        </div>
        
        <div class="form-group">
          <label>
            <input type="checkbox" id="autoConnect" checked />
            浏览器启动时自动连接
          </label>
        </div>
        
        <button id="testConnection" class="btn-primary">测试连接</button>
        <span id="connectionStatus"></span>
      </section>
      
      <!-- 订阅管理 -->
      <section class="section">
        <h2>订阅管理</h2>
        <div id="subscriptionList" class="subscription-list">
          <p class="empty-hint">暂无订阅，请先启动 Agent 服务</p>
        </div>
        
        <div class="form-group">
          <label>添加订阅:</label>
          <input type="text" id="subName" placeholder="订阅名称" />
          <input type="url" id="subURL" placeholder="订阅地址 (https://...)" />
          <button id="addSubscription" class="btn-primary">添加</button>
        </div>
      </section>
      
      <!-- 关于 -->
      <section class="section">
        <h2>关于</h2>
        <p>Proxy Manager v1.0.0</p>
        <p>本地代理管理工具</p>
        <p>
          <a href="#" id="viewDocs">查看文档</a> |
          <a href="#" id="reportIssue">报告问题</a>
        </p>
      </section>
      
      <!-- 保存按钮 -->
      <div class="actions">
        <button id="saveSettings" class="btn-success">保存设置</button>
      </div>
    </main>
  </div>
  
  <script type="module" src="options.js"></script>
</body>
</html>
