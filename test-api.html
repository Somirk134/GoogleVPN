<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>API 测试</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 14px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
    </style>
</head>
<body>
    <h1>Proxy Manager API 测试</h1>
    
    <div>
        <button onclick="testStatus()">测试 /api/v1/status</button>
        <button onclick="testProxies()">测试 /api/v1/proxies</button>
    </div>
    
    <div id="result">点击按钮测试 API...</div>
    
    <script>
        const API_BASE = 'http://127.0.0.1:8765';
        
        function log(message, isError = false) {
            const result = document.getElementById('result');
            const className = isError ? 'error' : 'success';
            result.innerHTML = `<span class="${className}">${message}</span>`;
        }
        
        async function testStatus() {
            try {
                log('正在请求 /api/v1/status...');
                
                const response = await fetch(`${API_BASE}/api/v1/status`);
                const data = await response.json();
                
                log(`成功！\n\n${JSON.stringify(data, null, 2)}`);
            } catch (error) {
                log(`失败！\n\n${error.message}`, true);
            }
        }
        
        async function testProxies() {
            try {
                log('正在请求 /api/v1/proxies...');
                
                const response = await fetch(`${API_BASE}/api/v1/proxies`);
                const data = await response.json();
                
                log(`成功！\n\n${JSON.stringify(data, null, 2)}`);
            } catch (error) {
                log(`失败！\n\n${error.message}`, true);
            }
        }
    </script>
</body>
</html>
